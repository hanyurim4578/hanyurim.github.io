<!-- 자동으로 내려가기 -->
<script>
let lastManualScroll = 0;
let lastTime = 0;
let pos = null; // 소수점까지 누적하는 현재 위치

const speed = 20; // 초당 스크롤 속도 (px)

// 사용자가 직접 스크롤하면 잠시 멈추고, 위치를 다시 동기화
["wheel", "touchstart", "keydown", "mousedown"].forEach(function(evt) {
  window.addEventListener(evt, function() {
    lastManualScroll = Date.now();
    pos = null;
  });
});

function autoScroll(time) {
  if (!lastTime) lastTime = time;

  const delta = Math.min(time - lastTime, 100); // 탭 전환 후 튀는 것 방지
  lastTime = time;

  if (!window.autoScrollPaused && Date.now() - lastManualScroll > 1000) {

    const maxScroll =
      document.documentElement.scrollHeight - window.innerHeight;

    if (pos === null) pos = window.scrollY;

    if (pos < maxScroll) {
      pos += speed * delta / 1000;
      window.scrollTo(0, pos);
    }
  } else {
    pos = null;
  }

  requestAnimationFrame(autoScroll);
}

window.addEventListener("load", function() {
  requestAnimationFrame(autoScroll);
});
</script>


<!-- 랜덤으로 답변 -->
<script>
const area = document.getElementById("randomTextArea");
const popup = document.getElementById("textPopup");
const sentence = document.getElementById("randomSentence");

// 랜덤 문장 목록
const sentences = [
  "먼저 연락한다고 지는 건 아닙니다. 다만 이번에는 조금만 기다려보세요.",
  "그 사람도 당신을 생각하고 있을지도 몰라요.",
  "모든 인연을 붙잡고 있을 필요는 없어요.",
  "당신이 먼저 다가가도 괜찮아요. 상대도 당신을 반가워할 거에요.",
  "그 사람의 말보다 행동을 믿어보세요.",
  "모든 관계에는 적당한 거리가 필요합니다."
];

let previousSentence = -1;

// 이미지 클릭 시 팝업 열기
area.addEventListener("click", function() {

  let randomIndex;

  do {
    randomIndex = Math.floor(Math.random() * sentences.length);
  } while (randomIndex === previousSentence);

  previousSentence = randomIndex;

  sentence.textContent = sentences[randomIndex];

  popup.style.display = "flex";

  // 자동 스크롤 멈추기
  window.autoScrollPaused = true;

});

// X 버튼 클릭 시 팝업 닫기
function closeTextPopup() {

  popup.style.display = "none";

  // 자동 스크롤 다시 시작
  window.autoScrollPaused = false;

}
</script>
