<!-- 자동으로 내려가기 -->
<script>
let lastManualScroll = 0;
let lastTime = 0;

const speed = 28; // 초당 스크롤 속도 (px)

window.addEventListener("wheel", function() {
  lastManualScroll = Date.now();
});

function autoScroll(time) {
  if (!lastTime) lastTime = time;

  const delta = time - lastTime;
  lastTime = time;

  // 마우스 스크롤 후 1초 동안 자동 스크롤 멈춤
  if (!window.autoScrollPaused && Date.now() - lastManualScroll > 1000) {

    // 페이지 맨 아래에 도달하면 멈춤
    const atBottom =
      window.innerHeight + window.scrollY >=
      document.documentElement.scrollHeight - 1;

    if (!atBottom) {
      window.scrollBy(0, speed * delta / 1000);
    }
  }

  requestAnimationFrame(autoScroll);
}

requestAnimationFrame(autoScroll);
</script>


<!-- 랜덤으로 답변 -->
<script>
const area = document.getElementById("randomTextArea");
const popup = document.getElementById("textPopup");
const sentence = document.getElementById("randomSentence");

// 랜덤 문장 목록
const sentences = [
  "오늘은 조금 게을러도 괜찮습니다.",
  "굳이 모든 감정에 이름을 붙이지 않아도 됩니다.",
  "오늘은 스스로에게 조금 너그러워지세요.",
  "조금 웃길 일이 생길지도 모릅니다. 오늘 하루 기대해도 좋아요."
];

let previousSentence = -1;

// 이미지 클릭 시 팝업 열기
area.addEventListener("click", function() {

  let randomIndex;

  do {
    randomIndex = Math.floor(Math.random() * sentences.length);
  } while (randomIndex === previousSentence);

  previousSentence = randomIndex;

  sentence.textContent = sentences[randomIndex];

  popup.style.display = "flex";

  // 자동 스크롤 멈추기
  window.autoScrollPaused = true;

});

// X 버튼 클릭 시 팝업 닫기
function closeTextPopup() {

  popup.style.display = "none";

  // 자동 스크롤 다시 시작
  window.autoScrollPaused = false;

}
</script>
